[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truthnews"
version = "0.1.0"
description = "Periodico de verificacion automatizado: rastrea medios, contrasta con datos y compara coberturas"
readme = "README.md"
license = { text = "CC0-1.0" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "feedparser>=6.0.11",
  "trafilatura>=1.12",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
  "anthropic>=1.15",
  "pillow>=10.4",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "respx>=0.21"]

[project.scripts]
truthnews = "truthnews.cli:main"

[tool.setuptools.packages.find]
include = ["truthnews*"]

[tool.setuptools.package-data]
truthnews = ["registry/*.yaml", "registry/sources/*.yaml", "web/templates/*.html", "web/static/*", "web/fonts/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["truthnews"]
omit = ["truthnews/__main__.py"]
