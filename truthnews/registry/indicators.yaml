# Indicadores comprobables. Cada uno: como se reconoce en un texto (por idioma) y de que serie oficial
# sale el dato para cada pais. `geo` de la afirmacion: pais nombrado en la frase o, si no, el del medio.
# unit: pct (porcentaje: se compara en puntos) | abs (cantidad: se compara en %).
paro:
  name: {es: Tasa de paro, en: Unemployment rate}
  unit: pct
  patterns:
    es: ["tasa de paro", "tasa de desempleo", "paro", "desempleo"]
    en: ["unemployment rate", "unemployment"]
    pt: ["taxa de desemprego", "desemprego"]
  sources:
    - {connector: eurostat, dataset: une_rt_m, params: {s_adj: SA, age: TOTAL, sex: T, unit: PC_ACT}, geos: EU}
    - {connector: worldbank, indicator: SL.UEM.TOTL.ZS}
    # EPA (INE, tabla 65334): tasa de paro trimestral por comunidad autonoma, ambos sexos, total.
    - connector: ine_level
      geos: [ES-AN, ES-AR, ES-AS, ES-IB, ES-CN, ES-CB, ES-CL, ES-CM, ES-CT, ES-VC, ES-EX, ES-GA, ES-MD, ES-MC, ES-NC, ES-PV, ES-RI, ES-CE, ES-ML]
      series_by_geo: {ES-AN: EPA452440, ES-AR: EPA452448, ES-AS: EPA452456, ES-IB: EPA452464, ES-CN: EPA452472,
        ES-CB: EPA452480, ES-CL: EPA452488, ES-CM: EPA452496, ES-CT: EPA452504, ES-VC: EPA452512, ES-EX: EPA452520,
        ES-GA: EPA452528, ES-MD: EPA452536, ES-MC: EPA452544, ES-NC: EPA452552, ES-PV: EPA452560, ES-RI: EPA452568,
        ES-CE: EPA452576, ES-ML: EPA452584}
  regional: true  # admite comunidades autonomas nombradas sin ambiguedad (region_names)
inflacion:
  name: {es: Inflación interanual, en: Annual inflation}
  unit: pct
  patterns:
    es: ["inflación", "ipc", "ipca", "precios al consumo", "subida de precios"]
    en: ["inflation", "consumer prices", "cpi"]
    pt: ["inflação", "preços no consumidor"]
  # La subyacente y los subindices (alimentos, energia...) son otras series: no se comparan con la general.
  excludes: [subyacente, "core inflation", "núcleo", alimentos, alimentación, energía, energética, energéticos,
    carburantes, electricidad, servicios, bienes industriales]
  sources:
    - {connector: ine_yoy, serie: IPC290751, geos: [ES]}
    # IPCA armonizado: el IPC nacional de cada pais puede diferir unas decimas (caso real, La Gaceta de
    # Salamanca 19/10/2026: Francia 3,1 % frente a 3,4 % del IPCA). En esa franja no se juzga.
    - {connector: eurostat, dataset: prc_hicp_minr, params: {unit: RCH_A, coicop18: TOTAL}, geos: EU, other_measure: IPC nacional}
    - {connector: worldbank, indicator: FP.CPI.TOTL.ZG}
inflacion_subyacente:
  name: {es: Inflación subyacente interanual, en: Annual core inflation}
  unit: pct
  patterns:
    es: ["inflación subyacente", "ipc subyacente", "subyacente"]
    en: ["core inflation"]
    pt: ["inflação subjacente"]
  sources:
    # INE base 2025: general sin alimentos no elaborados ni productos energeticos, variacion anual (tabla 76130).
    - {connector: ine_level, series_by_geo: {ES: IPC292510}, geos: [ES]}
pib_trimestral:
  name: {es: Crecimiento trimestral del PIB, en: Quarterly GDP growth}
  unit: pct
  patterns:
    es: ["pib", "producto interior bruto", "la economía"]
    en: ["gdp", "the economy"]
    pt: ["pib", "a economia"]
  requires: ["trimestre", "trimestral", "quarter"]
  change_is_level: true  # el indicador ya es una tasa de variacion: "crece un 0,7 %" es su valor
  directional: false  # "el PIB crece un 0,7 %" describe la economia, no la evolucion de la tasa
  sources:
    - {connector: eurostat, dataset: namq_10_gdp, params: {unit: CLV_PCH_PRE, s_adj: SCA, na_item: B1GQ}, geos: EU}
    - {connector: worldbank, indicator: NY.GDP.MKTP.KD.ZG}
pib_anual:
  name: {es: Crecimiento anual del PIB, en: Annual GDP growth}
  unit: pct
  change_is_level: true  # "la economia crecio un 2,6 % en 2025" es el valor del indicador
  directional: false
  annual: true  # el ano escrito en la frase es el periodo citado
  patterns:
    es: ["pib", "producto interior bruto", "la economía"]
    en: ["gdp", "the economy"]
    pt: ["pib", "a economia"]
  requires: ["anual", "en el conjunto del año", "annual"]
  requires_year_ok: true  # tambien vale un ano escrito ("en 2025")
  excludes: [trimestre, trimestral, quarter, "este año", "este ejercicio", "próximo año", "this year", "per cápita"]
  sources:
    - {connector: eurostat, dataset: nama_10_gdp, params: {unit: CLV_PCH_PRE, na_item: B1GQ}, geos: EU}
    - {connector: worldbank, indicator: NY.GDP.MKTP.KD.ZG}
deuda_publica:
  name: {es: Deuda pública (% del PIB), en: Government debt (% of GDP)}
  unit: pct
  of_gdp: true  # "la deuda publica es del 101,8 % del PIB": aqui "del PIB" es la unidad, no otro dato
  patterns:
    es: ["deuda pública", "deuda de las administraciones"]
    en: ["public debt", "government debt", "national debt"]
    pt: ["dívida pública"]
  sources:
    - {connector: eurostat, dataset: gov_10q_ggdebt, params: {unit: PC_GDP, sector: S13, na_item: GD}, geos: EU}
    # Sin Banco Mundial: GC.DOD.TOTL.GD.ZS es la deuda del gobierno central, no la de las administraciones
    # publicas que citan los medios (puede diferir decenas de puntos). Fuera de la UE no se juzga (v10).
deficit_publico:
  name: {es: Déficit público (% del PIB), en: Government deficit (% of GDP)}
  unit: pct
  of_gdp: true
  directional: false  # "sube el deficit" es ambiguo con el signo: solo se compara el nivel
  patterns:
    es: ["déficit público", "déficit de las administraciones públicas", "déficit fiscal"]
    en: ["government deficit", "budget deficit", "fiscal deficit"]
    pt: ["défice público", "défice orçamental", "déficit público"]
  sources:
    # Eurostat publica la capacidad (+) o necesidad (-) de financiacion (B9): el deficit es su opuesto.
    - {connector: eurostat, dataset: gov_10dd_edpt1, params: {unit: PC_GDP, sector: S13, na_item: B9}, geos: EU, negate: true}
gasto_publico:
  name: {es: Gasto público (% del PIB), en: Government expenditure (% of GDP)}
  unit: pct
  of_gdp: true
  directional: false
  patterns:
    es: ["gasto público", "gasto de las administraciones públicas"]
    en: ["government expenditure", "public spending", "government spending"]
    pt: ["despesa pública"]
  requires: ["pib", "producto interior bruto", "gdp"]  # el total sobre el PIB, no una partida
  excludes: [sanitario, sanidad, educativo, educación, defensa, militar, pensiones, "per cápita", presupuesto]
  sources:
    # Propuesto y comprobado por la sesion Datos politicos (2026-10-19): ES 2025 = 45,3 %.
    - {connector: eurostat, dataset: gov_10a_main, params: {unit: PC_GDP, sector: S13, na_item: TE}, geos: EU}
ingresos_publicos:
  name: {es: Ingresos públicos (% del PIB), en: Government revenue (% of GDP)}
  unit: pct
  of_gdp: true
  directional: false
  patterns:
    es: ["ingresos públicos", "ingresos de las administraciones públicas"]
    en: ["government revenue", "public revenue"]
    pt: ["receita pública"]
  requires: ["pib", "producto interior bruto", "gdp"]
  excludes: ["per cápita", presupuesto]
  sources:
    - {connector: eurostat, dataset: gov_10a_main, params: {unit: PC_GDP, sector: S13, na_item: TR}, geos: EU}
riesgo_pobreza:
  name: {es: Tasa de riesgo de pobreza, en: At-risk-of-poverty rate}
  unit: pct
  directional: false
  patterns:
    es: ["riesgo de pobreza", "tasa de pobreza"]
    en: ["at risk of poverty", "at-risk-of-poverty", "poverty rate"]
    pt: ["risco de pobreza", "taxa de pobreza"]
  excludes: ["exclusión", "exclusion", "exclusão", "arope", "severa", "infantil", "extrema"]
  sources:
    - {connector: eurostat, dataset: ilc_li02, params: {unit: PC, age: TOTAL, sex: T, statinfo: MED_EI, rskpovth: B_60}, geos: EU}
pobreza_exclusion:
  name: {es: Riesgo de pobreza o exclusión social (AROPE), en: At risk of poverty or social exclusion (AROPE)}
  unit: pct
  directional: false
  patterns:
    es: ["riesgo de pobreza o exclusión social", "riesgo de pobreza o exclusión", "pobreza o exclusión social", "tasa arope"]
    en: ["at risk of poverty or social exclusion", "poverty or social exclusion"]
    pt: ["risco de pobreza ou exclusão social"]
  excludes: ["infantil", "severa"]
  sources:
    - {connector: eurostat, dataset: ilc_peps01n, params: {unit: PC, age: TOTAL, sex: T}, geos: EU}
precio_vivienda:
  name: {es: Precio de la vivienda (variación anual), en: House prices (annual change)}
  unit: pct
  change_is_level: true
  # Otras medidas del precio (portales, tasadoras, notarios: euros/m2 de oferta o tasacion) y segmentos
  # (usada, nueva, alquiler) no son el indice oficial: compararlas con el seria injusto con el medio.
  excludes: [idealista, fotocasa, tinsa, "pisos.com", notarios, registradores, tasación, tasacion, "metro cuadrado",
    "m2", "€/m2", alquiler, usada, "segunda mano", "obra nueva", nueva]
  patterns:
    es: ["precio de la vivienda", "precios de la vivienda", "precio de los pisos", "precio de la casa"]
    en: ["house prices", "home prices", "housing prices"]
    pt: ["preço da habitação", "preços das casas"]
  directional: false
  sources:
    - {connector: eurostat, dataset: prc_hpi_q, params: {purchase: TOTAL, unit: RCH_A}, geos: EU}
poblacion:
  name: {es: Población, en: Population}
  unit: abs
  patterns:
    es: ["habitantes", "población"]
    en: ["population", "inhabitants"]
    pt: ["habitantes", "população"]
  requires_explicit_geo: true  # las cifras de poblacion casi nunca son del pais del medio por defecto
  sources:
    - {connector: worldbank, indicator: SP.POP.TOTL}

# Nombres de pais en el texto -> codigo ISO 3166-1 alfa-2 (Eurostat usa EL para Grecia).
geo_names:
  ES: [españa, spain, espanha]
  FR: [francia, france, frança]
  DE: [alemania, germany, alemanha]
  IT: [italia, italy, itália]
  PT: [portugal]
  GB: [reino unido, united kingdom, gran bretaña, britain]
  US: [estados unidos, eeuu, ee.uu., united states, usa]
  GR: [grecia, greece, grécia]
  NL: [países bajos, holanda, netherlands]
  BE: [bélgica, belgium]
  IE: [irlanda, ireland]
  PL: [polonia, poland]
  SE: [suecia, sweden]
  AT: [austria]
  RU: [rusia, russia]
  UA: [ucrania, ukraine]
  CN: [china]
  MA: [marruecos, morocco]
  AR: [argentina]
  MX: [méxico, mexico]
  IL: [israel]
  EU: [unión europea, european union, união europeia]
  EA: [eurozona, zona euro, euro area, eurozone, zona do euro]
eu_geos: [AT, BE, BG, CY, CZ, DE, DK, EE, ES, FI, FR, GR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK, EU, EA]
# Gentilicios y lideres: si aparecen en la frase sin pais explicito, la afirmacion no se atribuye al pais
# del medio (no se extrae). Mejor callar que atribuir mal.
foreign_markers: [ruso, rusa, frances, francesa, aleman, alemana, italiano, italiana, britanico, britanica,
  estadounidense, norteamericano, chino, china, marroqui, israeli, ucraniano, ucraniana, portugues,
  portuguesa, griego, griega, europeo, europea, argentino, mexicano, venezolano, turco, iraní, irani,
  macron, trump, putin, zelenski, netanyahu, meloni, merz, starmer, xi jinping, lula, milei, bruselas,
  otan]
# Comunidades autonomas por su nombre inequivoco. "Madrid", "Valencia" o "Murcia" a secas pueden ser la
# ciudad: no se atribuyen (la frase se descarta si los nombra sin "Comunidad de", "Region de"...).
region_names:
  ES-AN: [andalucía]
  ES-AR: [aragón]
  ES-AS: [asturias, principado de asturias]
  ES-IB: [illes balears, islas baleares, baleares]
  ES-CN: [canarias]
  ES-CB: [cantabria]
  ES-CL: [castilla y león]
  ES-CM: [castilla-la mancha, castilla la mancha]
  ES-CT: [cataluña, catalunya]
  ES-VC: [comunitat valenciana, comunidad valenciana]
  ES-EX: [extremadura]
  ES-GA: [galicia]
  ES-MD: [comunidad de madrid]
  ES-MC: [región de murcia]
  ES-NC: [navarra]
  ES-PV: [país vasco, euskadi]
  ES-RI: [la rioja]
  ES-CE: [ceuta]
  ES-ML: [melilla]
