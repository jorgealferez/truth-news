  about: Qué es esto
  about_text: >-
    Rastreamos automáticamente cientos de medios, agrupamos la misma noticia contada por cada uno,
    contrastamos sus afirmaciones con fuentes de datos oficiales y abiertas y señalamos lo que cada medio
    omite. Cada veredicto enlaza su evidencia; cuando no hay datos suficientes, lo decimos. El nombre no
    señala a nadie: «¿nos mienten?» es la pregunta que se hace cualquier lector, y aquí se responde con
    datos y con el mismo método para todos los medios, sea cual sea su línea editorial.
