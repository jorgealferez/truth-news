  methodology_text: >-
    1) Every 30 minutes we crawl hundreds of outlets, respecting robots.txt. 2) We group articles telling the
    same story. 3) We compare who reports it, which figures each gives and when, what most report and some omit,
    and the loaded words each outlet uses. 4) We extract only explicit numeric claims about official indicators
    and compare them with the latest Eurostat, INE or World Bank series. 5) Verdicts: True (up to 0.2 points or
    3%), Imprecise (up to 0.6 points or 10%), False (more), Misleading (claimed trend contradicts the data) and
    Not enough data. We never judge with data older than 400 days. Every verdict links its source. Same rules
    for every outlet.
