  about_text: >-
    We automatically crawl hundreds of outlets, group the same story as told by each one, check their
    claims against official and open data sources and flag what each outlet leaves out. Every verdict
    links its evidence; when the data is not enough, we say so. The name ("are they lying to us?") points
    at no one: it is the question every reader asks, answered here with data and with the same method
    for every outlet, whatever its editorial line.
