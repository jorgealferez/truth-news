  ent_method: "Extracción automática: nombres del registro curado y nombres propios descubiertos en el texto (una entidad descubierta se publica cuando la nombran al menos 2 medios). Una frase se atribuye a quien habla solo con un verbo de declaración o «según». Las noticias de archivo vienen de la hemeroteca de GDELT y solo se citan: titular, fecha y enlace."
  methodology_text: >-
    1) Rastreamos cada 30 minutos cientos de medios, respetando robots.txt. 2) Agrupamos en una historia los
    artículos que cuentan lo mismo (similitud de titulares y entradillas, medida contra un conjunto etiquetado a
    mano). 3) Comparamos: quién lo cuenta, qué cifras da cada uno y a qué hora, qué datos cuenta la mayoría y
    alguno omite, y qué palabras valorativas usa cada medio. Solo comparamos cifras del mismo hecho: de cada
    artículo cuenta la del titular, y dos cifras que se diferencian en más de tres veces son hechos distintos
    salvo que ambas se atribuyan a una fuente («según…»). 4) Extraemos solo afirmaciones numéricas
    explícitas sobre indicadores oficiales (paro, inflación, PIB, deuda, déficit, pobreza, vivienda, población) y las comparamos
    con la serie publicada por Eurostat, el INE o el Banco Mundial para el periodo que cita la frase. Para
    encontrar más, una IA lee las frases con cifras y propone indicador, territorio y periodo; nuestras reglas
    comprueban que la frase y la cifra están en el texto y que territorio y periodo cuadran, y si no, no se
    juzga. El veredicto lo da siempre el código con el dato oficial, nunca la IA. 5) Veredictos: Verdadero (diferencia
    de hasta 0,2 puntos o 3 %), Impreciso (hasta 0,6 puntos o 10 %), Falso (más), Engañoso (la tendencia
    afirmada contradice el dato) y Sin datos suficientes (no hay serie fresca o la afirmación no es
    comprobable). Nunca juzgamos con datos de hace más de 400 días. Cada veredicto enlaza su fuente. No
    tomamos partido: aplicamos las mismas reglas a todos los medios.
    Respetamos robots.txt. Única excepción: si para contrastar un dato concreto hace falta un documento
    concreto (por ejemplo, de un portal de transparencia) porque los medios discrepan o faltan pruebas, y no se
    obtiene por otra vía, llegamos a ese documento con un máximo de 5 páginas, con nuestro identificador real,
    parando ante cualquier bloqueo; cada página visitada y el motivo quedan en la evidencia.
  advertising: Publicidad
  advertising_title: Publicidad en nosmienten.com
  advertising_lead: >-
    Para sostener el proyecto mostramos poca publicidad, discreta y siempre señalada como tal. Nunca toca
    lo que verificamos ni cómo lo contamos.
  advertising_what_h: Qué publicidad hay
  advertising_what: >-
    Hoy solo anunciamos marcas propias del grupo Simvix, al que pertenece nosmienten.com; cada anuncio lo
    indica con «Marca del grupo Simvix». En el futuro podrá haber anunciantes de terceros, con las mismas
    reglas. Como mucho verás un anuncio dentro de una historia (después de la comparativa entre medios),
    uno en cada listado y una franja encima del pie.
  advertising_label_h: Siempre etiquetada
  advertising_label: >-
    Cada anuncio lleva la etiqueta visible «Publicidad», un aspecto distinto del de nuestras noticias y su
    enlace marcado como patrocinado, como exigen el artículo 20 de la Ley 34/2002 de servicios de la
    sociedad de la información (LSSI), el artículo 9 de la Ley 34/1988 General de Publicidad y el artículo
    26 de la Ley 3/1991 de Competencia Desleal. Nunca lo hacemos pasar por información.
  advertising_context_h: Elegida por el contenido, sin cookies ni perfiles
  advertising_context: >-
    El anuncio se elige solo por el tema de la página que estás leyendo (sección y palabras clave). No
    usamos cookies publicitarias, no creamos perfiles ni compartimos datos personales. Para no repetirte el
    mismo anuncio usamos un identificador opaco que cambia cada día y no se guarda. Cada anuncio tiene un
    desplegable «Por qué veo esto».
  advertising_independence_h: Independencia
  advertising_independence: >-
    La publicidad nunca influye en los veredictos, en lo que verificamos ni en el orden de las noticias:
    los decide el código con datos y el mismo método para todos. Un anunciante, propio o ajeno, no puede
    pedir que se publique, se retire o se cambie nada. No aceptamos publicidad política, de partidos,
    gobiernos ni administraciones; las páginas sobre elecciones no llevan anuncios, y ninguno aparece junto a
    un veredicto ni junto a lo que dicen los partidos.
  advertising_contact_h: Contacto
  advertising_contact: >-
    Para preguntas sobre la publicidad o para anunciarte, abre una incidencia en el repositorio público del
    proyecto (github.com/jorgealferez/truth-news).
