  ent_method: "Automatic extraction: names from our curated registry and proper names found in the text (a discovered entity is published once at least 2 outlets name it). A sentence is attributed to a speaker only with a reporting verb or \"according to\". Archive stories come from the GDELT archive and are only cited: headline, date and link."
  methodology_text: >-
    1) Every 30 minutes we crawl hundreds of outlets, respecting robots.txt. 2) We group articles telling the
    same story. 3) We compare who reports it, which figures each gives and when, what most report and some omit,
    and the loaded words each outlet uses. We only compare figures about the same fact: the headline figure
    counts, and two figures more than three times apart are different facts unless both are attributed
    ("according to…"). 4) We extract only explicit numeric claims about official indicators
    and compare them with the Eurostat, INE or World Bank series for the period the sentence cites. To find
    more, an AI reads sentences with figures and proposes indicator, territory and period; our rules check that
    the sentence and figure are in the text and that territory and period fit, or it is not judged. The verdict
    is always given by code against the official data, never by the AI. 5) Verdicts: True (up to 0.2 points or
    3%), Imprecise (up to 0.6 points or 10%), False (more), Misleading (claimed trend contradicts the data) and
    Not enough data. We never judge with data older than 400 days. Every verdict links its source. Same rules
    for every outlet.
    We respect robots.txt. Only exception: when checking a specific figure needs a specific document (e.g. on a
    transparency portal) because outlets disagree or proof is missing, and it cannot be obtained otherwise, we
    reach that document in at most 5 pages, with our real identifier, stopping at any block; every visited
    page and the reason are kept in the evidence.
  advertising: Advertising
  advertising_title: Advertising on nosmienten.com
  advertising_lead: >-
    To keep the project going we show a little advertising, discreet and always labelled. It never touches
    what we check or how we report it.
  advertising_what_h: What advertising we show
  advertising_what: >-
    Today we only advertise brands of the Simvix group, which owns nosmienten.com; each ad says so with
    "Simvix group brand". Third-party advertisers may follow under the same rules. At most you will see one
    ad inside a story (after the outlet comparison), one in each listing and a strip above the footer.
  advertising_label_h: Always labelled
  advertising_label: >-
    Every ad carries a visible "Advertising" label, looks different from our news and its link is marked as
    sponsored, as required by article 20 of Spanish Law 34/2002 (LSSI), article 9 of the General Advertising
    Law 34/1988 and article 26 of the Unfair Competition Law 3/1991. We never pass it off as news.
  advertising_context_h: Chosen by content, no cookies or profiles
  advertising_context: >-
    The ad is chosen only from the topic of the page you are reading (section and keywords). We use no
    advertising cookies, build no profiles and share no personal data. To avoid repeating the same ad we
    use an opaque identifier that changes every day and is never stored. Each ad has a "Why am I seeing
    this" panel.
  advertising_independence_h: Independence
  advertising_independence: >-
    Advertising never influences verdicts, what we check or the order of the news: the code decides with
    data and the same method for everyone. No advertiser, ours or third-party, can ask for anything to be
    published, removed or changed. We accept no political advertising, nor ads from parties, governments or
    public administrations; pages about elections carry no ads, and no ad appears next to a verdict or next
    to what the parties say.
  advertising_contact_h: Contact
  advertising_contact: >-
    For questions about advertising or to advertise, open an issue in the project's public repository
