# Medido 2026-10-19 con tools/check_feeds.py y fuera hasta tener un feed valido (no se elude ningun
# bloqueo): the-independent (HTTP 429), itv-news (ReadTimeout).
# Medios del Reino Unido (BBC News y The Guardian estan en xx.yaml como referencia internacional).
country: GB
default_language: en
outlets:
  - {slug: sky-news, name: Sky News, homepage: "https://news.sky.com", scope: national, kind: tv,
     feeds: [{url: "https://feeds.skynews.com/feeds/rss/home.xml"}, {url: "https://feeds.skynews.com/feeds/rss/world.xml", category: internacional},
             {url: "https://feeds.skynews.com/feeds/rss/politics.xml", category: politica}]}
  - {slug: the-telegraph, name: The Telegraph, homepage: "https://www.telegraph.co.uk", scope: national,
     feeds: [{url: "https://www.telegraph.co.uk/rss.xml"}, {url: "https://www.telegraph.co.uk/news/rss.xml"}]}
  - {slug: financial-times, name: Financial Times, homepage: "https://www.ft.com", scope: national,
     feeds: [{url: "https://www.ft.com/rss/home", category: economia}, {url: "https://www.ft.com/world?format=rss", category: internacional}]}
  - {slug: daily-mail, name: Daily Mail, homepage: "https://www.dailymail.co.uk", scope: national,
     feeds: [{url: "https://www.dailymail.co.uk/news/index.rss"}, {url: "https://www.dailymail.co.uk/news/worldnews/index.rss", category: internacional}]}
  - {slug: the-economist, name: The Economist, homepage: "https://www.economist.com", scope: national,
     feeds: [{url: "https://www.economist.com/international/rss.xml", category: internacional}, {url: "https://www.economist.com/europe/rss.xml", category: internacional}]}
