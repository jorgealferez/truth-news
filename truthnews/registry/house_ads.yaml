# Banners propios y contenido patrocinado de Ridelta por zona (ADR 0055).
# Datos copiados de vtc-clm (solo lectura): src/lib/provinces.ts, src/lib/provincias-cyl.ts y src/lib/geo.ts,
# version de main del 2026-10-20. Solo zonas con servicio contratado (Castilla-La Mancha y Castilla y Leon:
# pie legal de ridelta.com); Madrid y los sitios de mercado (taximadrid.ridelta.com...) quedan fuera mientras
# su pie no diga que se presta servicio alli. Para anadir una zona: una entrada en zones y su slug en regions.
#   generic_domain: destino cuando no se sabe la zona del lector.
#   apps_in_stores: false mientras ridelta.com/apps diga "en preparacion para las tiendas"; no se anuncia una
#                   app de tienda que no existe (la web se instala como app).
#   radius_km: distancia maxima de la ubicacion del lector al municipio mas cercano de una zona.
#   towns: [nombre, lat, lon] de los municipios de origen de cada zona (geolocalizacion y lectura del contenido).
brand: Ridelta
generic_domain: ridelta.com
apps_in_stores: false
radius_km: 45
regions:
